        type: start
        variables:
        - label: 工号
          max_length: 32
          options: []
          required: true
          type: text-input
          variable: player_id
      height: 116
      id: start
      position:
        x: 30
        y: 320
      positionAbsolute:
        x: 30
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 把玩家自然语言归一成 intent / 关键词 / 行动概括，作为检索条件
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 4
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: intent-sys
          role: system
          text: |
            你是《午夜档案馆》派单台的调度分类器。只输出一个 JSON 对象，不要代码块围栏、不要任何解释。

            字段与取值：
            - intent：四选一
              "start"＝玩家想开局/换场景/描述口味（句子里出现“派个活/开局/换个/我想玩/继续上一局”等）
              "act"＝玩家描述自己在本局中要做的一件事
              "reveal"＝玩家想查看档案、规则原文、已解锁内容
              "finale"＝玩家想结束本局、索要结局
            - keywords：从玩家原话里挑 3 个中文关键词，优先怪谈名词（如 电梯/楼层/对讲机/粉笔/雨衣/电台/座位），
              不要“我/然后/可以/一下”这类虚词；原话实在没有名词就给场景通用词（如 门/声音/走廊）。
            - action：不超过 40 字，用第三人称概括玩家本轮要做的事，形如“玩家打算……”。
            - difficulty：1 到 5 的整数，玩家没提难度就填 0。
              “简单点/别太难/新手”＝1～2，“中等/正常”＝3，“难一点/要命/越狠越好”＝4～5。

            当前场景：{{#conversation.scene_title#}}（可能为空）
        - id: intent-user
          role: user
          text: |
            玩家本轮输入：{{#sys.query#}}
        selected: false
        title: 意图与关键词抽取
        type: llm
        variables:
        - value_selector:
          - conversation
          - scene_title
          variable: scene_title
        vision:
          configs:
            detail: high
          enabled: false
      height: 116
      id: intent_llm
      position:
        x: 340
        y: 320
      positionAbsolute:
        x: 340
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json
          import re

          REROLL_WORDS = ("换个", "换场景", "换单", "重新派", "重派", "来点新的", "换一个",
                          "新的一局", "重新开局", "别的场景", "不要这个", "重开")
          # 「别重派」「不要换场景」里同样含“重派/换个”字样：先抹掉否定说法，
          # 剩下的才算真的想重派，否则一句“继续上一局，别重派”就把场景换掉了。
          NEGATED_REROLL = re.compile(
              r"(?:别|不要|不想|不用|不必|不准|不许|不想再|没有|没|先别|可别|千万别|不)"
              r"(?:再|要|给我|换|重新)*"
              r"(?:%s)" % "|".join(REROLL_WORDS))


          def main(raw: str, query: str) -> dict:
              """容错解析分类器输出：任何不合法 JSON 都不应该让游戏卡住。"""
              txt = (raw or "").strip()
              m = re.search(r"\{.*\}", txt, re.S)
              data = {}
              if m:
                  try:
                      data = json.loads(m.group(0))
                  except Exception:
                      data = {}
              if not isinstance(data, dict):
                  data = {}
              intent = str(data.get("intent") or "act").strip().lower()
              if intent not in ("start", "act", "reveal", "finale"):
                  intent = "act"
              kws = data.get("keywords") or []
              if isinstance(kws, str):
                  kws = [kws]
              kw_list = [re.sub(r"\s+", "", str(k)) for k in kws if str(k).strip()][:3]
              action = re.sub(r"\s+", " ", str(data.get("action") or "")).strip()[:120]
              # reroll 只认玩家原话里的显式换单说法，不信模型的裁量：
              # 「继续 / 接着 / 然后呢」必须留在当前场景，重派是最破坏沉浸的误判。
              asked = str(query or "")
              wanted = NEGATED_REROLL.sub("", asked)
              reroll = 1 if (intent == "start" and any(w in wanted for w in REROLL_WORDS)) else 0
              try:
                  difficulty = int(data.get("difficulty"))
              except Exception:
                  difficulty = 0
              difficulty = max(0, min(difficulty, 5))
              return {
                  "intent": intent,
                  "keywords_csv": ",".join(kw_list),
                  "action": action or "玩家打算按原话行动",
                  "reroll": reroll,
                  "difficulty": difficulty,
              }
        code_language: python3
        desc: ''
        outputs:
          action:
            children: null
            type: string
          difficulty:
            children: null
            type: number
          intent:
            children: null
            type: string
          keywords_csv:
            children: null
            type: string
          reroll:
            children: null
            type: number
        selected: false
        title: 解析分类结果
        type: code
        variables:
        - value_selector:
          - intent_llm
          - text
          variable: raw
        - value_selector:
          - sys
          - query
          variable: query
      height: 96
      id: intent_code
      position:
        x: 650
        y: 320
      positionAbsolute:
        x: 650
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json
          import re


          def _pid(text):
              cleaned = re.sub(r"[^0-9A-Za-z\u4e00-\u9fff._\-]", "", str(text or ""))[:32]
              return cleaned or "ANON"


          def main(player_id: str) -> dict:
              """先只拼 PowerContext 建档请求体。检索请求体要等读完记忆之后再拼
              （见「组装检索请求体」），否则跨会话续不上档案袋里的那局。

              所有 HTTP 请求体都在这里 json.dumps，避免玩家原话里的引号/换行拼坏 JSON。
              """
              pid = _pid(player_id)
              scope_body = {
                  "title": "午夜档案馆·工号" + pid,
                  "summary": "规则怪谈玩家档案",
                  "idempotency_key": "archive-player-" + pid,
              }
              return {
                  "player_tag": pid,
                  "scope_body": json.dumps(scope_body, ensure_ascii=False),
              }
        code_language: python3
        desc: 把工号安全地编成 PowerContext 建档请求体（工号只清洗成 0-9A-Za-z 与少量符号，防注入）
        outputs:
          player_tag:
            children: null
            type: string
          scope_body:
            children: null
            type: string
        selected: false
        title: 组装请求体
        type: code
        variables:
        - value_selector:
          - start
          - player_id
          variable: player_id
      height: 96
      id: req_code
      position:
        x: 960
        y: 320
      positionAbsolute:
        x: 960
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-scope
            key: ''
            type: text
            value: '{{#req_code.scope_body#}}'
          type: raw-text
        desc: PowerContext 建档：同一工号靠 idempotency_key 复用同一个 scope，因此记忆能跨会话续上。参数必须逐字一致，否则返回 409。
        headers: 'Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 200
        selected: false
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 建立/复用工号档案袋
        type: http-request
        url: '{{#env.PC_BASE_URL#}}/v1/scopes'
        variables: []
      height: 150
      id: scope_http
      position:
        x: 1270
        y: 320
      positionAbsolute:
        x: 1270
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(body: str, status: str, fallback: str, player_tag: str, keywords_csv: str) -> dict:
              try:
                  sid = str(json.loads(body).get("scope_id") or "")
              except Exception:
                  sid = ""
              state = "created_or_reused"
              if not sid:
                  sid = str(fallback or "")
                  state = "fallback_env" if sid else "missing"
              # 写入侧说的是「违反 / 解锁封存规则 / 达成结局」，查询词必须跟着这套措辞，
              # 否则 fts 召回会漏掉自己上一局写下的条目（实测「违规」召不到「违反」）。
              query = ("%s %s 违反 违规 解锁 封存 结局 预兆" % (player_tag, keywords_csv)).strip()
              prepare_body = json.dumps({"scope_id": sid, "query": query, "max_bytes": 6000},
                                        ensure_ascii=False)
              list_body = json.dumps({"scope_id": sid, "include_inactive": False}, ensure_ascii=False)
              return {"scope_id": sid, "scope_state": state, "prepare_body": prepare_body, "list_body": list_body}
        code_language: python3
        desc: ''
        outputs:
          list_body:
            children: null
            type: string
          prepare_body:
            children: null
            type: string
          scope_id:
            children: null
            type: string
          scope_state:
            children: null
            type: string
        selected: false
        title: 取回 scope_id
        type: code
        variables:
        - value_selector:
          - scope_http
          - body
          variable: body
        - value_selector:
          - scope_http
          - status_code
          variable: status
        - value_selector:
          - env
          - PC_SCOPE_FALLBACK
          variable: fallback
        - value_selector:
          - req_code
          - player_tag
          variable: player_tag
        - value_selector:
          - intent_code
          - keywords_csv
          variable: keywords_csv
      height: 96
      id: scope_code
      position:
        x: 1580
        y: 320
      positionAbsolute:
        x: 1580
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-prepare
            key: ''
            type: text
            value: '{{#scope_code.prepare_body#}}'
          type: raw-text
        desc: PowerContext 取回该工号的历史上下文（违规记录、结局、偏好），每轮都读，所以翻旧账是真的从记忆里取出来的。
        headers: 'Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 200
        selected: false
        timeout:
