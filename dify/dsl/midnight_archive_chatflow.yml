    - data:
        code: |
          import json
          import re


          def _csv(text):
              return [x.strip() for x in re.split(r"[,，;；、]", str(text or "")) if x.strip()]


          def _list(value):
              """LLM 给的是 JSON 数组，会话变量给的是逗号串——两者都要能读。"""
              if value is None:
                  return []
              if isinstance(value, (list, tuple)):
                  got = [str(x).strip() for x in value]
              else:
                  got = _csv(value)
              return [g for g in got if g]


          def _only(codes, allowed):
              return [c for c in codes if c in allowed]


          def _merge(old, new):
              out = _list(old)
              for c in new:
                  if c not in out:
                      out.append(c)
              return ",".join(out)


          # Dify 把推理正文包成 “think 开标签 … think 闭标签”（闭合标签就是斜杠开头的那个）。
          # 两种形态都要处理：成对的只删这一段；被 max_tokens 截断、没有闭合标签的，
          # 必须从开标签一路删到末尾——正文里若写着「封存 2 条＝RAD-05/06」，留着就是泄露。
          THINK_CLOSE = r"<\s*/" + "think\\s*>"
          THINK_BLOCK = re.compile(r"<think\s*>.*?" + THINK_CLOSE, re.S)
          THINK_TAIL = re.compile(r"<think\s*>.*", re.S)
          REASON_MARK = re.compile(r"<!--\s*dify-deepseek-reasoning[^>]*-->")


          def _scrub(text):
              stripped = str(text or "")
              stripped = REASON_MARK.sub("", THINK_BLOCK.sub("", stripped))
              if "<think" in stripped:  # 闭合标签没出现：正文被截断了，整段丢掉
                  stripped = REASON_MARK.sub("", THINK_TAIL.sub("", stripped))
              return stripped.strip()


          def _json_objects(text):
              """括号配平扫描（认字符串内的花括号）：贪婪的 {.*} 会把思考正文里的
              花括号一并吞进来，整串交给 json.loads 就解析失败——实测漏过两次。"""
              found, depth, start, instr, esc = [], 0, -1, False, False
              for i, ch in enumerate(text):
                  if instr:
                      if esc:
                          esc = False
                      elif ch == "\\":
                          esc = True
                      elif ch == '"':
                          instr = False
                      continue
                  if ch == '"':
                      instr = True
                  elif ch == "{":
                      if depth == 0:
                          start = i
                      depth += 1
                  elif ch == "}" and depth:
                      depth -= 1
                      if depth == 0:
                          found.append(text[start:i + 1])
              # 裁决永远是最后吐出来的那个对象，倒着试最靠得住。
              return found[::-1]


          def _verdict(raw):
              """直接从模型原文里捞裁决对象：思考正文里有没有花括号、闭合标签有没有被
              max_tokens 截掉，都不该影响后面那段裁决的解析。"""
              text = str(raw or "")
              cand = list(_json_objects(text))
              m = re.search(r"\{.*\}", text, re.S)
              if m:
                  cand.append(m.group(0))
              for blob in cand:
                  try:
                      data = json.loads(blob)
                  except Exception:
                      continue
                  if isinstance(data, dict) and data:
                      return data
              return {}


          def main(raw: str, codes_csv: str, locked_csv: str, revealed_in: str,
                   violations_in: str, endings_in: str, turn: float,
                   scene_title: str, scene_id: str, player_id: str, action: str,
                   intent: str, scope_id: str) -> dict:
              data = _verdict(raw)
              allowed = set(_csv(codes_csv))
              locked = set(_csv(locked_csv))
              revealed = _list(revealed_in)

              triggered = _only(_list(data.get("triggered")), allowed)
              near = _only(_list(data.get("near")), allowed)
              ending = str(data.get("ending") or "").strip()
              if ending not in allowed:
                  ending = ""
              sealed_hint = str(data.get("sealed_hint") or "").strip()
              if sealed_hint not in locked or sealed_hint in revealed:
                  sealed_hint = ""
              revealed_now = _only(_list(data.get("revealed_now")), locked - set(revealed))

              narration = _scrub(data.get("narration"))
              if not narration:
                  # 解析失败时不能把模型原文当叙述吐给玩家：那是 deepseek 的推理正文，
                  # 里面写着“封存 2 条＝RAD-03/05”这类玩家不该看到的话。
                  if data:
                      narration = "档案馆的灯闪了一下。主持人没有回应你的描述，请你把动作说得更具体些。"
                  else:
                      narration = "主持人笔下的那行字被潮气泡花了，没能递到你手上。请把动作说得更具体些，或换个说法再来一次。"
              narration = narration[:1200]
              # 闸门：模型可以在叙述里“提到”封存编号，但玩家就不可能知道那是猜的还是泄露的。
              # 未解锁的编号一律从叙述文本里抹掉——白名单不只管裁决，也管措辞。
              redacted = []
              unlocked = set(revealed) | set(revealed_now)
              for code in sorted(locked):
                  if code in unlocked or code not in narration:
                      continue
                  narration = narration.replace(code, "一段还没被写下来的规矩")
                  redacted.append(code)

              violations_next = _merge(violations_in, triggered)
              endings_next = _merge(endings_in, [ending] if ending else [])
              revealed_next = _merge(revealed_in, revealed_now)

              if triggered:
                  kind = "violation"
              elif revealed_now:
                  kind = "unlock"
              elif ending:
                  kind = "ending"
              else:
                  kind = "progress"

              bits = ["工号 %s 在《%s》第 %d 轮 当前场景=%s：%s" % (
                  player_id, scene_title or "未派单", int(turn or 0) + 1, scene_id or "none", action)]
              if triggered:
                  bits.append("违反 " + "/".join(triggered))
              if near:
                  bits.append("预兆 " + "/".join(near))
              if revealed_now:
                  bits.append("解锁封存规则 " + "/".join(revealed_now))
              if ending:
                  bits.append("达成结局 " + ending)
              if sealed_hint:
                  bits.append("疑似触碰封存 " + sealed_hint)
              mem_text = "；".join(bits).replace('"', "'").replace("\n", " ")[:1500]

              cite = "本轮引用：" + ("、".join(triggered + near + revealed_now + ([ending] if ending else [])) or "无")
              remember_body = json.dumps({
                  "scope_id": str(scope_id or ""),
                  "kind": kind,
                  "text": mem_text,
                  "reason": "dify-chatflow-turn",
              }, ensure_ascii=False)
              return {
                  "narration": narration,
                  "narration_redacted": ",".join(redacted),
                  "remember_body": remember_body,
                  "mem_kind": kind,
                  "mem_text": mem_text,
                  "violations_next": violations_next,
                  "endings_next": endings_next,
                  "revealed_next": revealed_next,
                  "turn_next": int(turn or 0) + 1,
                  "stage_next": "ended" if ending else "playing",
                  "cite_line": cite,
                  "mood": str(data.get("mood") or "")[:16],
                  "sealed_hint": sealed_hint,
              }
        code_language: python3
        desc: 校验主持人引用的编号必须来自本轮检索结果（防幻觉），并把本轮事实整理成待写入 PowerContext
          的记忆；解析不出裁决 JSON 时只说固定的兜底文案，绝不把模型原文（含推理正文）吐给玩家
        outputs:
          cite_line:
            children: null
            type: string
          endings_next:
            children: null
            type: string
          mem_kind:
            children: null
            type: string
          mem_text:
