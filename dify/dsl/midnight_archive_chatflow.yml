app:
  description: |
    《午夜档案馆》规则怪谈主持应用。Dify Chatflow 负责编排与裁决生成，seekdb（嵌入式 pyseekdb）承担怪谈设定档案库的存储与三路混合检索，
    PowerContext 承担玩家记忆的保存与复用。导入后请检查：环境变量（服务地址与令牌）、两个 LLM 节点的模型绑定。
  icon: 🌙
  icon_background: '#1F2A44'
  mode: advanced-chat
  name: 午夜档案馆 · 规则怪谈
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables:
  - description: 当前场景编号；空字符串表示还没派单
    id: cv-scene-id-0001
    name: scene_id
    selector:
    - conversation
    - scene_id
    value: ''
    value_type: string
  - description: 当前场景标题，用于主持文本与状态条
    id: cv-scene-title-002
    name: scene_title
    selector:
    - conversation
    - scene_title
    value: ''
    value_type: string
  - description: 已解锁的封存规则编号（逗号分隔），会作为结构化过滤条件回传给 seekdb
    id: cv-revealed-0003
    name: revealed
    selector:
    - conversation
    - revealed
    value: ''
    value_type: string
  - description: 本工号累计违反的规则编号（逗号分隔）
    id: cv-violations-004
    name: violations
    selector:
    - conversation
    - violations
    value: ''
    value_type: string
  - description: 已达成结局编号（逗号分隔）
    id: cv-endings-0005
    name: endings
    selector:
    - conversation
    - endings
    value: ''
    value_type: string
  - description: 本局回合计数
    id: cv-turn-000006
    name: turn
    selector:
    - conversation
    - turn
    value: 0
    value_type: number
  - description: 流程阶段：idle / playing / ended
    id: cv-stage-00007
    name: stage
    selector:
    - conversation
    - stage
    value: idle
    value_type: string
  environment_variables:
  - description: 配套 seekdb 检索后端地址（本地自建填 http://127.0.0.1:8011；云端 Dify 需填可公网访问的隧道地址）
    id: env-archive-url-01
    name: ARCHIVE_BASE_URL
    selector:
    - env
    - ARCHIVE_BASE_URL
    value: http://127.0.0.1:8011
    value_type: string
  - description: 检索后端访问令牌，必须与后端 .env 中的 ARCHIVE_TOKEN 一致
    id: env-archive-token-02
    name: ARCHIVE_TOKEN
    selector:
    - env
    - ARCHIVE_TOKEN
    value: change-me-local-dev
    value_type: string
  - description: PowerContext 服务地址（HTTP API，默认无需令牌；启用鉴权时请在请求头里补 Bearer）
    id: env-pc-url-00003
    name: PC_BASE_URL
    selector:
    - env
    - PC_BASE_URL
    value: http://127.0.0.1:8000
    value_type: string
  - description: 兜底 scope：建档请求失败时仍允许继续游戏（留空表示失败即报错）
    id: env-pc-fallback-04
    name: PC_SCOPE_FALLBACK
    selector:
    - env
    - PC_SCOPE_FALLBACK
    value: ''
    value_type: string
  - description: 每轮从 seekdb 取回的档案条目数
    id: env-topk-0000005
    name: ARCHIVE_TOP_K
    selector:
    - env
    - ARCHIVE_TOP_K
    value: 6
    value_type: number
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
