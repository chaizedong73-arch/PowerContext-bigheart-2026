    - data:
        code: |
          import json


          def main(query: str, action: str, keywords_csv: str, scene_id: str,
                   revealed: str, reroll: float, top_k: float, difficulty: float,
                   remembered_scene: str) -> dict:
              """检索与派单请求体放到「读完记忆之后」再拼，这样会话变量为空时也能认出
              档案袋里记着的那一局——「继续」绝不该把玩家的场景重派掉。"""
              kws = str(keywords_csv or "").replace(",", " ")
              # 派单只看玩家自己的口味原话；第三人称概括是“他在要求派单”这类元话，
              # 混进口味里会把检索带偏（实测会把深夜电台换成电梯）。
              scene_taste = (str(query or "") + " " + kws).strip()[:600]
              act_taste = (action + " " + str(query or "")).strip()[:600]
              from_conv = str(scene_id or "")
              previous = from_conv or str(remembered_scene or "")
              rerolling = int(reroll or 0) == 1
              keep_scene = "" if rerolling else previous
              kinds = max(1, min(int(top_k or 6), 30))
              scene_body = {
                  "taste": scene_taste,
                  "scene_id": keep_scene,
                  "revealed_csv": str(revealed or ""),
              }
              # 「换个场景」是没有口味词的，纯按向量最近的那一幕常常还是刚才那一幕；
              # 所以换单时把上一幕交给后端排除，才真的换得掉。
              if rerolling and previous:
                  scene_body["exclude_scene_id"] = previous
              try:
                  diff = int(difficulty or 0)
              except Exception:
                  diff = 0
              if 1 <= diff <= 5:
                  scene_body["difficulty"] = diff
              search_body = {
                  "query": act_taste,
                  "scene_id": keep_scene,
                  "kinds_csv": "rule,omen,item,npc,ending",
                  "keywords_csv": str(keywords_csv or ""),
                  "top_k": kinds,
                  "revealed_csv": str(revealed or ""),
              }
              return {
                  "scene_body": json.dumps(scene_body, ensure_ascii=False),
                  "search_body": json.dumps(search_body, ensure_ascii=False),
                  "active_scene_id": keep_scene,
                  "scene_source": "conversation" if from_conv and keep_scene else ("memory" if keep_scene else "reroll"),
              }
