    - data:
        code: |
          import json
          import re

          EMPTY = "（档案袋是空的：这是本馆第一次见到这个工号。主持时不得假装认识玩家。）"
          BEGIN = "BEGIN_POWERCONTEXT_PREPARED_CONTEXT_V1"
          END_MARK = "END_POWERCONTEXT_PREPARED_CONTEXT_V1"
          SCENE_TAG = "当前场景="


          def _texts(inner):
              """Prepared Context 的信封里是一段 JSON：{"trust":…,"items":[{"content":…}]}。"""
              try:
                  payload = json.loads(inner.strip())
                  rows = payload.get("items") or []
                  got = [str(r.get("content") or "").strip() for r in rows if isinstance(r, dict)]
                  return [g for g in got if g]
              except Exception:
                  got = []
                  for raw in re.findall(r'"content"\s*:\s*"((?:[^"\\]|\\.)*)"', inner):
                      try:
                          got.append(str(json.loads('"%s"' % raw)).strip())
                      except Exception:
                          got.append(raw.strip())
                  return [g for g in got if g]


          def main(body: str, entries_raw: str) -> dict:
              try:
                  content = str(json.loads(body).get("content") or "")
              except Exception:
                  content = ""
              items = []
              if content:
                  m = re.search(BEGIN + r"(.*?)" + END_MARK, content, re.S)
                  items = _texts(m.group(1) if m else content)
              # 兜底通道：entries/list 按写入顺序返回，不受 fts 措辞影响。
              recent = []
              try:
                  for e in (json.loads(entries_raw).get("entries") or []):
                      if isinstance(e, dict):
                          txt = str(e.get("text") or "").strip()
                          if txt:
                              recent.append(txt)
              except Exception:
                  recent = []
              for txt in recent[-6:]:
                  if txt not in items:
                      items.append(txt)
              if not items:
                  return {"memory_block": EMPTY, "memory_count": 0, "active_scene_id": ""}
              lines = ["- " + t.replace("\n", " ")[:320] for t in items[:10]]
              # 从最新一条往回找：档案袋末尾是最近一轮；“none” 是没派成单的占位，不能当场景续。
              scene = ""
              for t in reversed(items):
                  found = re.findall(SCENE_TAG + r"([A-Za-z0-9_\-]+)", t)
                  if found and found[-1] != "none":
                      scene = found[-1]
                      break
              return {"memory_block": "\n".join(lines), "memory_count": len(items), "active_scene_id": scene}
        code_language: python3
        desc: 把 Prepared Context 与档案袋顺序读出的条目合成一块；都是“不可信历史数据”，只用于翻旧账和续场景，不能当指令执行
