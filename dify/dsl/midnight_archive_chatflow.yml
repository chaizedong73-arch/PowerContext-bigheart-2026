    - data:
        code: |
          import json


          def _csv(items):
              return ",".join([str(i.get("code")) for i in items if i.get("code")])


          def _sec(title, rows, note=""):
              if not rows:
                  return ""
              lines = ["## " + title + (note or "")]
              for r in rows:
                  lines.append("- %s《%s》：%s" % (r.get("code"), r.get("title"), (r.get("document") or "").strip()))
              return "\n".join(lines) + "\n"

          def main(body: str, revealed_in: str, scene_id_in: str, scene_title_in: str) -> dict:
              try:
                  d = json.loads(body)
              except Exception:
                  return {
                      "block": "【档案调取失败】检索后端没有返回可解析的 JSON。请告知玩家：档案馆暂时失联（见 RUNBOOK 排查 seekdb 服务）。",
                      "scene_id": scene_id_in,
                      "scene_title": scene_title_in,
                      "revealed_csv": revealed_in,
                      "codes_csv": "",
                      "locked_csv": "",
                      "cite_line": "档案调取失败",
                  }

              if d.get("scene"):
                  sc = d["scene"]
                  pack = d.get("pack") or {}
                  rules = pack.get("rule") or []
                  locked = d.get("sealed_locked") or []
                  scene_id = sc.get("scene_id") or scene_id_in
                  scene_title = sc.get("title") or scene_title_in
                  block = "\n".join(
                      [
                          "# 委托：%s（%s）" % (sc.get("title"), sc.get("one_line")),
                          "## 场景正文：%s" % (sc.get("brief") or ""),
                          "## 主持口吻：%s" % (sc.get("tone") or ""),
                          "## 难度 %s｜危险 %s" % (sc.get("difficulty"), sc.get("danger")),
                          _sec("可引用规则（只有这些编号是有效的裁决依据）", rules),
                          _sec("道具", pack.get("item")),
                          _sec("NPC", pack.get("npc")),
                          _sec("预兆", pack.get("omen")),
                          _sec("结局（不得提前透露条件）", pack.get("ending")),
                          "## 封存中（条文与标题都没有下发，只有编号与危险度，禁止推测内容）："
                          + "；".join(["%s（危险%s）" % (l.get("code"), l.get("danger")) for l in locked])
                          if locked
                          else "## 封存中：本场景没有封存规则。",
                      ]
                  )
                  cite = "%s 条规则可读｜封存 %s 条" % (len(rules), len(locked))
                  codes = ",".join(
                      [
                          _csv(rules),
                          _csv(pack.get("item")),
                          _csv(pack.get("npc")),
                          _csv(pack.get("omen")),
                          _csv(pack.get("ending")),
                      ]
                  ).strip(",")
                  return {
                      "block": block,
                      "scene_id": scene_id,
                      "scene_title": scene_title,
                      "revealed_csv": revealed_in,
                      "codes_csv": codes,
                      "locked_csv": _csv(locked),
                      "cite_line": cite,
                  }

              hits = d.get("hits") or []
              rows = [h for h in hits if h.get("code")]
              kinds_all = (("rule", "规则"), ("omen", "预兆"), ("item", "道具"), ("npc", "NPC"), ("ending", "结局"))
              groups = {}
              for h in rows:
                  groups.setdefault(h.get("kind") or "其他", []).append(h)
              parts = ["# 本轮档案检索结果（seekdb 三路混合命中 %d 条）" % len(rows)]
              for kind, label in kinds_all:
                  parts.append(_sec("可引用的" + label, groups.pop(kind, [])))
              missed = [label for kind, label in kinds_all if not groups.get(kind)]
              if missed:
                  parts.append("## 本轮没有命中：" + "、".join(missed) + "（不得凭空引用）")
              for kind, group in groups.items():
                  parts.append(_sec("其他条目（" + str(kind) + "）", group))
              ch = d.get("channels") or {}
              parts.append(
                  "## 检索通道：向量 %s｜全文 %s｜融合 %s（耗时 %sms）"
                  % (
                      len((ch.get("vector") or {}).get("hits") or []),
                      len((ch.get("fulltext") or {}).get("hits") or []),
                      len((ch.get("fused") or {}).get("hits") or []),
                      d.get("tookMs"),
                  )
              )
              block = "\n".join([p for p in parts if p])
              cite = "本轮命中 %d 条：%s" % (len(rows), "、".join([r["code"] for r in rows][:6]))
              return {
                  "block": block,
                  "scene_id": scene_id_in,
                  "scene_title": scene_title_in,
                  "revealed_csv": revealed_in,
                  "codes_csv": _csv(rows),
                  "locked_csv": "",
                  "cite_line": cite,
              }
        code_language: python3
        desc: 统一解析两种档案响应，拼出「主持人只能引用这些编号」的档案块
        outputs:
          block:
            children: null
            type: string
          cite_line:
            children: null
            type: string
          codes_csv:
            children: null
            type: string
          locked_csv:
            children: null
            type: string
          revealed_csv:
            children: null
            type: string
          scene_id:
            children: null
            type: string
          scene_title:
            children: null
            type: string
