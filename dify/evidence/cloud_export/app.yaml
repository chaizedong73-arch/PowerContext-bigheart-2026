      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '<center><font size="4">午夜档案馆</font></center>

      <div><font size="2">这里是档案馆的派单台。每份委托都对应一宗还没归档干净的怪谈。</font></div>

      <div>规矩写在档案里：违反一条，它就记你一次；档案里没写的，主持人不会凭空发明。</div>

      <div>先在「工号」里填一个你自己的编号（例如 A-1101），它就是你在这个馆里的身份。</div>

      <div><b>开局示例：</b>今晚给我派个活，我想要有声音、后背发凉但别太吓人的。</div>

      '
