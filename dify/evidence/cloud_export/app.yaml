      <div>规矩写在档案里：违反一条，它就记你一次；档案里没写的，主持人不会凭空发明。</div>

      <div>先在「工号」里填一个你自己的编号（例如 A-1101），它就是你在这个馆里的身份。</div>

      <div><b>开局示例：</b>今晚给我派个活，我想要有声音、后背发凉但别太吓人的。</div>

