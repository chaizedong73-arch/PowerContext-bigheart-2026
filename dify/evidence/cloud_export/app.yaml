    - data:
        code: "import json\n\n\ndef main(query: str, action: str, keywords_csv: str,\
          \ scene_id: str,\n         revealed: str, reroll: float, top_k: float, difficulty:\
          \ float,\n         remembered_scene: str) -> dict:\n    \"\"\"检索与派单请求体放到「读完记忆之后」再拼，这样会话变量为空时也能认出\n\
          \    档案袋里记着的那一局——「继续」绝不该把玩家的场景重派掉。\"\"\"\n    kws = str(keywords_csv or\
          \ \"\").replace(\",\", \" \")\n    # 派单只看玩家自己的口味原话；第三人称概括是“他在要求派单”这类元话，\n\
          \    # 混进口味里会把检索带偏（实测会把深夜电台换成电梯）。\n    scene_taste = (str(query or \"\"\
          ) + \" \" + kws).strip()[:600]\n    act_taste = (action + \" \" + str(query\
          \ or \"\")).strip()[:600]\n    from_conv = str(scene_id or \"\")\n    previous\
          \ = from_conv or str(remembered_scene or \"\")\n    rerolling = int(reroll\
          \ or 0) == 1\n    keep_scene = \"\" if rerolling else previous\n    kinds\
          \ = max(1, min(int(top_k or 6), 30))\n    scene_body = {\n        \"taste\"\
          : scene_taste,\n        \"scene_id\": keep_scene,\n        \"revealed_csv\"\
          : str(revealed or \"\"),\n    }\n    # 「换个场景」是没有口味词的，纯按向量最近的那一幕常常还是刚才那一幕；\n\
          \    # 所以换单时把上一幕交给后端排除，才真的换得掉。\n    if rerolling and previous:\n       \
          \ scene_body[\"exclude_scene_id\"] = previous\n    try:\n        diff =\
          \ int(difficulty or 0)\n    except Exception:\n        diff = 0\n    if\
          \ 1 <= diff <= 5:\n        scene_body[\"difficulty\"] = diff\n    search_body\
          \ = {\n        \"query\": act_taste,\n        \"scene_id\": keep_scene,\n\
          \        \"kinds_csv\": \"rule,omen,item,npc,ending\",\n        \"keywords_csv\"\
          : str(keywords_csv or \"\"),\n        \"top_k\": kinds,\n        \"revealed_csv\"\
          : str(revealed or \"\"),\n    }\n    return {\n        \"scene_body\": json.dumps(scene_body,\
          \ ensure_ascii=False),\n        \"search_body\": json.dumps(search_body,\
          \ ensure_ascii=False),\n        \"active_scene_id\": keep_scene,\n     \
          \   \"scene_source\": \"conversation\" if from_conv and keep_scene else\
          \ (\"memory\" if keep_scene else (\"reroll\" if rerolling else \"fresh\"\
          )),\n    }\n"
        code_language: python3
