    - data:
        code: "import json\nimport re\n\n\ndef _csv(text):\n    return [x.strip()\
          \ for x in re.split(r\"[,，;；、]\", str(text or \"\")) if x.strip()]\n\n\n\
          def _list(value):\n    \"\"\"LLM 给的是 JSON 数组，会话变量给的是逗号串——两者都要能读。\"\"\"\n\
          \    if value is None:\n        return []\n    if isinstance(value, (list,\
          \ tuple)):\n        got = [str(x).strip() for x in value]\n    else:\n \
          \       got = _csv(value)\n    return [g for g in got if g]\n\n\ndef _only(codes,\
          \ allowed):\n    return [c for c in codes if c in allowed]\n\n\ndef _merge(old,\
          \ new):\n    out = _list(old)\n    for c in new:\n        if c not in out:\n\
          \            out.append(c)\n    return \",\".join(out)\n\n\n# Dify 把推理正文包成\
          \ “think 开标签 … think 闭标签”（闭合标签就是斜杠开头的那个）。\n# 两种形态都要处理：成对的只删这一段；被 max_tokens\
          \ 截断、没有闭合标签的，\n# 必须从开标签一路删到末尾——正文里若写着「封存 2 条＝RAD-05/06」，留着就是泄露。\nTHINK_CLOSE\
          \ = r\"<\\s*/\" + \"think\\\\s*>\"\nTHINK_BLOCK = re.compile(r\"<think\\\
          s*>.*?\" + THINK_CLOSE, re.S)\nTHINK_TAIL = re.compile(r\"<think\\s*>.*\"\
          , re.S)\nREASON_MARK = re.compile(r\"<!--\\s*dify-deepseek-reasoning[^>]*-->\"\
          )\n\n\ndef _scrub(text):\n    stripped = str(text or \"\")\n    stripped\
          \ = REASON_MARK.sub(\"\", THINK_BLOCK.sub(\"\", stripped))\n    if \"<think\"\
          \ in stripped:  # 闭合标签没出现：正文被截断了，整段丢掉\n        stripped = REASON_MARK.sub(\"\
          \", THINK_TAIL.sub(\"\", stripped))\n    return stripped.strip()\n\n\ndef\
          \ _json_objects(text):\n    \"\"\"括号配平扫描（认字符串内的花括号）：贪婪的 {.*} 会把思考正文里的\n\
          \    花括号一并吞进来，整串交给 json.loads 就解析失败——实测漏过两次。\"\"\"\n    found, depth, start,\
          \ instr, esc = [], 0, -1, False, False\n    for i, ch in enumerate(text):\n\
          \        if instr:\n            if esc:\n                esc = False\n \
          \           elif ch == \"\\\\\":\n                esc = True\n         \
          \   elif ch == '\"':\n                instr = False\n            continue\n\
          \        if ch == '\"':\n            instr = True\n        elif ch == \"\
          {\":\n            if depth == 0:\n                start = i\n          \
          \  depth += 1\n        elif ch == \"}\" and depth:\n            depth -=\
          \ 1\n            if depth == 0:\n                found.append(text[start:i\
          \ + 1])\n    # 裁决永远是最后吐出来的那个对象，倒着试最靠得住。\n    return found[::-1]\n\n\ndef\
          \ _verdict(raw):\n    \"\"\"直接从模型原文里捞裁决对象：思考正文里有没有花括号、闭合标签有没有被\n    max_tokens\
          \ 截掉，都不该影响后面那段裁决的解析。\"\"\"\n    text = str(raw or \"\")\n    cand = list(_json_objects(text))\n\
          \    m = re.search(r\"\\{.*\\}\", text, re.S)\n    if m:\n        cand.append(m.group(0))\n\
          \    for blob in cand:\n        try:\n            data = json.loads(blob)\n\
          \        except Exception:\n            continue\n        if isinstance(data,\
          \ dict) and data:\n            return data\n    return _salvage(text)\n\n\
          \nFIELD_KEYS = (\"triggered\", \"near\", \"sealed_hint\", \"revealed_now\"\
          , \"ending\", \"mood\")\n\n\ndef _unquote(raw):\n    raw = raw.rstrip()\n\
          \    if raw.endswith(\"\\\\\"):\n        raw = raw[:-1]\n    return (raw.replace(\"\
          \\\\n\", \"\\n\").replace(\"\\\\t\", \"\\t\")\n                .replace('\\\
          \\\"', '\"').replace(\"\\\\\\\\\", \"\\\\\")).strip()\n\n\ndef _salvage(text):\n\
          \    \"\"\"整串 JSON 解析不出来时的兜底（云端实测有轮次被 max_tokens 截断、也有轮次\n    叙述里直接写了裸引号）：逐字段抠——叙述取到下一个已知键名之前（没有就到末尾），\n\
          \    数组与短字段只认写完整的那一段。抠不出任何字段才回落到固定兜底文案。\"\"\"\n    out = {}\n    m = re.search(r'\"\
          narration\"\\s*:\\s*\"', text)\n    if m:\n        tail = text[m.end():]\n\
          \        stop = len(tail)\n        for key in FIELD_KEYS:\n            k\
          \ = re.search(r'\"\\s*,\\s*\"%s\"\\s*:' % key, tail)\n            if k and\
          \ k.start() < stop:\n                stop = k.start()\n        out[\"narration\"\
          ] = _unquote(tail[:stop])\n    for key in (\"triggered\", \"near\", \"revealed_now\"\
          ):\n        a = re.search(r'\"%s\"\\s*:\\s*\\[(.*?)\\]' % key, text, re.S)\n\
          \        if a:\n            out[key] = re.findall(r'\"([A-Za-z0-9_.\\-]+)\"\
          ', a.group(1))\n    for key in (\"sealed_hint\", \"ending\", \"mood\"):\n\
          \        s = re.search(r'\"%s\"\\s*:\\s*\"([^\"]*)\"' % key, text)\n   \
          \     if s:\n            out[key] = s.group(1)\n    return {k: v for k,\
          \ v in out.items() if v not in (\"\", [], None)}\n\nPROSE_MIN = 60\n\n\n\
          def _prose(raw):\n    \"\"\"裁决整个不存在的形状（云端实测：模型照着自己上一轮的玩家可见文本续写，\n    连状态条都写了，却没吐\
          \ JSON）：只有 think 成对闭合时才用剩下的正文当叙述。\n    被截断的 think 里写着封存编号，那种情况一律回落到固定文案。\"\
          \"\"\n    text = str(raw or \"\")\n    if \"<think\" in text and not THINK_BLOCK.search(text):\n\
          \        return \"\"\n    body = THINK_TAIL.sub(\"\", REASON_MARK.sub(\"\
          \", THINK_BLOCK.sub(\"\", text))).strip()\n    if body.lstrip().startswith(\"\
          {\") or '\"narration\"' in body:\n        return \"\"\n    for cut in (\"\
          \\n---\", \"\\n\U0001FAAA\", \"\\n\U0001F4C1\", \"\\n⛔\"):\n        i =\
          \ body.find(cut)\n        if i > 0:\n            body = body[:i]\n    body\
          \ = body.strip()\n    return body if len(body) >= PROSE_MIN else \"\"\n\n\
          \ndef main(raw: str, codes_csv: str, locked_csv: str, revealed_in: str,\n\
          \         violations_in: str, endings_in: str, turn: float,\n         scene_title:\
          \ str, scene_id: str, player_id: str, action: str,\n         intent: str,\
          \ scope_id: str) -> dict:\n    data = _verdict(raw)\n    allowed = set(_csv(codes_csv))\n\
          \    locked = set(_csv(locked_csv))\n    revealed = _list(revealed_in)\n\
          \n    triggered = _only(_list(data.get(\"triggered\")), allowed)\n    near\
          \ = _only(_list(data.get(\"near\")), allowed)\n    ending = str(data.get(\"\
          ending\") or \"\").strip()\n    if ending not in allowed:\n        ending\
          \ = \"\"\n    sealed_hint = str(data.get(\"sealed_hint\") or \"\").strip()\n\
          \    if sealed_hint not in locked or sealed_hint in revealed:\n        sealed_hint\
          \ = \"\"\n    revealed_now = _only(_list(data.get(\"revealed_now\")), locked\
          \ - set(revealed))\n\n    narration = _scrub(data.get(\"narration\"))\n\
          \    if not narration:\n        # 解析失败时不能把模型原文当叙述吐给玩家：那是 deepseek 的推理正文，\n\
          \        # 里面写着“封存 2 条＝RAD-03/05”这类玩家不该看到的话。\n        if data:\n       \
          \     narration = \"档案馆的灯闪了一下。主持人没有回应你的描述，请你把动作说得更具体些。\"\n        else:\n\
          \            # 整段裁决都不存在时先试「只写了主持文本、没写 JSON」那种形状；\n            # 抠不出可用叙述才回落固定文案。两条路都要过下面那道封存编号闸门。\n\
          \            narration = _prose(raw) or \"主持人笔下的那行字被潮气泡花了，没能递到你手上。请把动作说得更具体些，或换个说法再来一次。\"\
          \n    narration = narration[:1200]\n    # 闸门：模型可以在叙述里“提到”封存编号，但玩家就不可能知道那是猜的还是泄露的。\n\
          \    # 未解锁的编号一律从叙述文本里抹掉——白名单不只管裁决，也管措辞。\n    redacted = []\n    unlocked\
          \ = set(revealed) | set(revealed_now)\n    for code in sorted(locked):\n\
          \        if code in unlocked or code not in narration:\n            continue\n\
          \        narration = narration.replace(code, \"一段还没被写下来的规矩\")\n        redacted.append(code)\n\
          \n    violations_next = _merge(violations_in, triggered)\n    endings_next\
          \ = _merge(endings_in, [ending] if ending else [])\n    revealed_next =\
          \ _merge(revealed_in, revealed_now)\n\n    if triggered:\n        kind =\
          \ \"violation\"\n    elif revealed_now:\n        kind = \"unlock\"\n   \
          \ elif ending:\n        kind = \"ending\"\n    else:\n        kind = \"\
          progress\"\n\n    bits = [\"工号 %s 在《%s》第 %d 轮 当前场景=%s：%s\" % (\n       \
          \ player_id, scene_title or \"未派单\", int(turn or 0) + 1, scene_id or \"\
          none\", action)]\n    if triggered:\n        bits.append(\"违反 \" + \"/\"\
          .join(triggered))\n    if near:\n        bits.append(\"预兆 \" + \"/\".join(near))\n\
          \    if revealed_now:\n        bits.append(\"解锁封存规则 \" + \"/\".join(revealed_now))\n\
          \    if ending:\n        bits.append(\"达成结局 \" + ending)\n    if sealed_hint:\n\
          \        bits.append(\"疑似触碰封存 \" + sealed_hint)\n    mem_text = \"；\".join(bits).replace('\"\
          ', \"'\").replace(\"\\n\", \" \")[:1500]\n\n    cite = \"本轮引用：\" + (\"、\"\
          .join(triggered + near + revealed_now + ([ending] if ending else [])) or\
          \ \"无\")\n    remember_body = json.dumps({\n        \"scope_id\": str(scope_id\
          \ or \"\"),\n        \"kind\": kind,\n        \"text\": mem_text,\n    \
          \    \"reason\": \"dify-chatflow-turn\",\n    }, ensure_ascii=False)\n \
          \   return {\n        \"narration\": narration,\n        \"narration_redacted\"\
          : \",\".join(redacted),\n        \"remember_body\": remember_body,\n   \
          \     \"mem_kind\": kind,\n        \"mem_text\": mem_text,\n        \"violations_next\"\
          : violations_next,\n        \"endings_next\": endings_next,\n        \"\
          revealed_next\": revealed_next,\n        \"turn_next\": int(turn or 0) +\
          \ 1,\n        \"stage_next\": \"ended\" if ending else \"playing\",\n  \
          \      \"cite_line\": cite,\n        \"mood\": str(data.get(\"mood\") or\
          \ \"\")[:16],\n        \"sealed_hint\": sealed_hint,\n    }\n"
        code_language: python3
        desc: 校验主持人引用的编号必须来自本轮检索结果（防幻觉），并把本轮事实整理成待写入 PowerContext 的记忆；解析不出裁决 JSON
          时只说固定的兜底文案，绝不把模型原文（含推理正文）吐给玩家
        outputs:
          cite_line:
            children: null
