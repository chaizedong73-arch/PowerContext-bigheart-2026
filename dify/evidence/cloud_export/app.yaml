app:
  description: '《午夜档案馆》规则怪谈主持应用。Dify Chatflow 负责编排与裁决生成，seekdb（嵌入式 pyseekdb）承担怪谈设定档案库的存储与三路混合检索，

    PowerContext 承担玩家记忆的保存与复用。导入后请检查：环境变量（服务地址与令牌）、两个 LLM 节点的模型绑定。

    '
  icon: 🌙
  icon_background: '#1F2A44'
  icon_type: emoji
  mode: advanced-chat
  name: 午夜档案馆 · 规则怪谈
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.26@bdf47cb41e9062bba00d26625d2a795c1874011d8ce64bff738c44b5a31787ea
    version: null
kind: app
site:
  chat_color_theme: null
  chat_color_theme_inverted: false
  copyright: null
  custom_disclaimer: ''
  default_language: zh-Hans
  description: null
  icon: 🌙
  icon_background: '#1F2A44'
  icon_type: emoji
  input_placeholder: null
  privacy_policy: null
  show_workflow_steps: true
  title: 午夜档案馆 · 规则怪谈
  use_icon_as_answer_icon: false
version: 0.7.0
