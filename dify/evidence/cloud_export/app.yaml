          \nBEGIN = \"BEGIN_POWERCONTEXT_PREPARED_CONTEXT_V1\"\nEND_MARK = \"END_POWERCONTEXT_PREPARED_CONTEXT_V1\"\
          \n\n\ndef _texts(inner):\n    \"\"\"Prepared Context 的信封里是一段 JSON：{\"trust\"\
          :…,\"items\":[{\"content\":…}]}。\"\"\"\n    try:\n        payload = json.loads(inner.strip())\n\
          \        rows = payload.get(\"items\") or []\n        got = [str(r.get(\"\
          content\") or \"\").strip() for r in rows if isinstance(r, dict)]\n    \
          \    return [g for g in got if g]\n    except Exception:\n        got =\
          \ []\n        for raw in re.findall(r'\"content\"\\s*:\\s*\"((?:[^\"\\\\\
          ]|\\\\.)*)\"', inner):\n            try:\n                got.append(str(json.loads('\"\
          %s\"' % raw)).strip())\n            except Exception:\n                got.append(raw.strip())\n\
          \        return [g for g in got if g]\n\n\ndef main(body: str) -> dict:\n\
          \    try:\n        content = str(json.loads(body).get(\"content\") or \"\
          \")\n    except Exception:\n        return {\"memory_block\": \"（记忆服务本次没有返回内容，按新玩家接待。）\"\
          , \"memory_count\": 0}\n    if not content:\n        return {\"memory_block\"\
          : EMPTY, \"memory_count\": 0}\n    m = re.search(BEGIN + r\"(.*?)\" + END_MARK,\
          \ content, re.S)\n    items = _texts(m.group(1) if m else content)\n   \
          \ if not items:\n        return {\"memory_block\": EMPTY, \"memory_count\"\
          : 0}\n    lines = [\"- \" + t.replace(\"\\n\", \" \")[:320] for t in items[:8]]\n\
          \    return {\"memory_block\": \"\\n\".join(lines), \"memory_count\": len(items)}\n"
