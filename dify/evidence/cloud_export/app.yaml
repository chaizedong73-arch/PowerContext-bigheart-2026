    - data:
        code: "import json\n\n\ndef _csv(items):\n    return \",\".join([str(i.get(\"\
          code\")) for i in items if i.get(\"code\")])\n\n\ndef _sec(title, rows,\
          \ note=\"\"):\n    if not rows:\n        return \"\"\n    lines = [\"##\
          \ \" + title + (note or \"\")]\n    for r in rows:\n        lines.append(\"\
          - %s《%s》：%s\" % (r.get(\"code\"), r.get(\"title\"), (r.get(\"document\"\
          ) or \"\").strip()))\n    return \"\\n\".join(lines) + \"\\n\"\n\ndef main(body:\
          \ str, revealed_in: str, scene_id_in: str, scene_title_in: str) -> dict:\n\
          \    try:\n        d = json.loads(body)\n    except Exception:\n       \
          \ return {\n            \"block\": \"【档案调取失败】检索后端没有返回可解析的 JSON。请告知玩家：档案馆暂时失联（见\
          \ RUNBOOK 排查 seekdb 服务）。\",\n            \"scene_id\": scene_id_in,\n  \
          \          \"scene_title\": scene_title_in,\n            \"revealed_csv\"\
          : revealed_in,\n            \"codes_csv\": \"\",\n            \"locked_csv\"\
          : \"\",\n            \"cite_line\": \"档案调取失败\",\n        }\n\n    if d.get(\"\
          scene\"):\n        sc = d[\"scene\"]\n        pack = d.get(\"pack\") or\
          \ {}\n        rules = pack.get(\"rule\") or []\n        locked = d.get(\"\
          sealed_locked\") or []\n        scene_id = sc.get(\"scene_id\") or scene_id_in\n\
          \        scene_title = sc.get(\"title\") or scene_title_in\n        block\
          \ = \"\\n\".join(\n            [\n                \"# 委托：%s（%s）\" % (sc.get(\"\
          title\"), sc.get(\"one_line\")),\n                \"## 场景正文：%s\" % (sc.get(\"\
          brief\") or \"\"),\n                \"## 主持口吻：%s\" % (sc.get(\"tone\") or\
          \ \"\"),\n                \"## 难度 %s｜危险 %s\" % (sc.get(\"difficulty\"),\
          \ sc.get(\"danger\")),\n                _sec(\"可引用规则（只有这些编号是有效的裁决依据）\",\
          \ rules),\n                _sec(\"道具\", pack.get(\"item\")),\n         \
          \       _sec(\"NPC\", pack.get(\"npc\")),\n                _sec(\"预兆\",\
          \ pack.get(\"omen\")),\n                _sec(\"结局（不得提前透露条件）\", pack.get(\"\
          ending\")),\n                \"## 封存中（条文与标题都没有下发，只有编号与危险度，禁止推测内容）：\"\n \
          \               + \"；\".join([\"%s（危险%s）\" % (l.get(\"code\"), l.get(\"\
          danger\")) for l in locked])\n                if locked\n              \
          \  else \"## 封存中：本场景没有封存规则。\",\n            ]\n        )\n        cite =\
          \ \"%s 条规则可读｜封存 %s 条\" % (len(rules), len(locked))\n        codes = \",\"\
          .join(\n            [\n                _csv(rules),\n                _csv(pack.get(\"\
          item\")),\n                _csv(pack.get(\"npc\")),\n                _csv(pack.get(\"\
          omen\")),\n                _csv(pack.get(\"ending\")),\n            ]\n\
          \        ).strip(\",\")\n        return {\n            \"block\": block,\n\
          \            \"scene_id\": scene_id,\n            \"scene_title\": scene_title,\n\
          \            \"revealed_csv\": revealed_in,\n            \"codes_csv\":\
          \ codes,\n            \"locked_csv\": _csv(locked),\n            \"cite_line\"\
          : cite,\n        }\n\n    hits = d.get(\"hits\") or []\n    rows = [h for\
          \ h in hits if h.get(\"code\")]\n    kinds_all = ((\"rule\", \"规则\"), (\"\
          omen\", \"预兆\"), (\"item\", \"道具\"), (\"npc\", \"NPC\"), (\"ending\", \"\
          结局\"))\n    groups = {}\n    for h in rows:\n        groups.setdefault(h.get(\"\
          kind\") or \"其他\", []).append(h)\n    # 后端按 scene_id 整条交回本场景结局：行动轮 top_k\
          \ 撞不撞得中结局条文全看措辞，\n    # 撞不中时主持人没有触发条件全文，就永远不许封盘。编号进可引用白名单，是否宣布仍由铁律 5 裁。\n\
          \    hit_codes = {r[\"code\"] for r in rows}\n    extra = [e for e in (d.get(\"\
          scene_endings\") or []) if e.get(\"code\") and e[\"code\"] not in hit_codes]\n\
          \    for e in extra:\n        groups.setdefault(\"ending\", []).append(e)\n\
          \    present = set(groups)\n    parts = [\"# 本轮档案检索结果（seekdb 三路混合命中 %d 条）\"\
          \ % len(rows)]\n    for kind, label in kinds_all:\n        note = \"（条件全文，不得提前向玩家透露；只有玩家本轮真的凑齐触发条件时才允许宣布）\"\
          \ if kind == \"ending\" else \"\"\n        parts.append(_sec(\"可引用的\" +\
          \ label, groups.pop(kind, []), note))\n    missed = [label for kind, label\
          \ in kinds_all if kind not in present]\n    if missed:\n        parts.append(\"\
          ## 本轮没有命中：\" + \"、\".join(missed) + \"（不得凭空引用）\")\n    for kind, group in\
          \ groups.items():\n        parts.append(_sec(\"其他条目（\" + str(kind) + \"\
          ）\", group))\n    ch = d.get(\"channels\") or {}\n    parts.append(\n  \
          \      \"## 检索通道：向量 %s｜全文 %s｜融合 %s（耗时 %sms）\"\n        % (\n           \
          \ len((ch.get(\"vector\") or {}).get(\"hits\") or []),\n            len((ch.get(\"\
          fulltext\") or {}).get(\"hits\") or []),\n            len((ch.get(\"fused\"\
          ) or {}).get(\"hits\") or []),\n            d.get(\"tookMs\"),\n       \
          \ )\n    )\n    gated = d.get(\"sealed_gated\") or []\n    if gated:\n \
          \       parts.append(\n            \"## 本场景仍在封存中（后端只交回编号与危险度，条文与标题都没有下发，禁止推测内容）：\"\
          \n            + \"；\".join([\"%s（危险%s）\" % (g.get(\"code\"), g.get(\"danger\"\
          )) for g in gated])\n            + \"\\n玩家本轮若做出了道具/NPC 条文里写明的用途动作，就把对应编号放进\
          \ revealed_now；条件没满足就留空数组。\"\n        )\n    block = \"\\n\".join([p for\
          \ p in parts if p])\n    cite = \"本轮命中 %d 条：%s\" % (len(rows), \"、\".join([r[\"\
          code\"] for r in rows][:6]))\n    return {\n        \"block\": block,\n\
          \        \"scene_id\": scene_id_in,\n        \"scene_title\": scene_title_in,\n\
          \        \"revealed_csv\": revealed_in,\n        \"codes_csv\": _csv(rows\
          \ + extra),\n        \"locked_csv\": _csv(gated),\n        \"cite_line\"\
          : cite,\n    }\n"
