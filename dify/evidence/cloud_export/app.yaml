    - data:
        code: "import json\nimport re\n\n\ndef _csv(text):\n    return [x.strip()\
          \ for x in re.split(r\"[,，;；、]\", str(text or \"\")) if x.strip()]\n\n\n\
          def _list(value):\n    \"\"\"LLM 给的是 JSON 数组，会话变量给的是逗号串——两者都要能读。\"\"\"\n\
          \    if value is None:\n        return []\n    if isinstance(value, (list,\
          \ tuple)):\n        got = [str(x).strip() for x in value]\n    else:\n \
          \       got = _csv(value)\n    return [g for g in got if g]\n\n\ndef _only(codes,\
          \ allowed):\n    return [c for c in codes if c in allowed]\n\n\ndef _merge(old,\
          \ new):\n    out = _list(old)\n    for c in new:\n        if c not in out:\n\
          \            out.append(c)\n    return \",\".join(out)\n\n\ndef main(raw:\
          \ str, codes_csv: str, locked_csv: str, revealed_in: str,\n         violations_in:\
          \ str, endings_in: str, turn: float,\n         scene_title: str, player_id:\
          \ str, action: str, intent: str,\n         scope_id: str) -> dict:\n   \
          \ txt = (raw or \"\").strip()\n    m = re.search(r\"\\{.*\\}\", txt, re.S)\n\
          \    data = {}\n    if m:\n        try:\n            data = json.loads(m.group(0))\n\
          \        except Exception:\n            data = {}\n    if not isinstance(data,\
          \ dict):\n        data = {}\n\n    allowed = set(_csv(codes_csv))\n    locked\
          \ = set(_csv(locked_csv))\n    revealed = _list(revealed_in)\n\n    triggered\
          \ = _only(_list(data.get(\"triggered\")), allowed)\n    near = _only(_list(data.get(\"\
          near\")), allowed)\n    ending = str(data.get(\"ending\") or \"\").strip()\n\
          \    if ending not in allowed:\n        ending = \"\"\n    sealed_hint =\
          \ str(data.get(\"sealed_hint\") or \"\").strip()\n    if sealed_hint not\
          \ in locked or sealed_hint in revealed:\n        sealed_hint = \"\"\n  \
          \  revealed_now = _only(_list(data.get(\"revealed_now\")), locked - set(revealed))\n\
          \n    narration = str(data.get(\"narration\") or \"\").strip()\n    if not\
          \ narration:\n        if data:\n            narration = \"档案馆的灯闪了一下。主持人没有回应你的描述，请你把动作说得更具体些。\"\
          \n        else:\n            narration = (txt or \"主持人低头核对表格，没有出声。请把动作说得更具体些。\"\
          )[:600]\n    narration = narration[:1200]\n\n    violations_next = _merge(violations_in,\
          \ triggered)\n    endings_next = _merge(endings_in, [ending] if ending else\
          \ [])\n    revealed_next = _merge(revealed_in, revealed_now)\n\n    if triggered:\n\
          \        kind = \"violation\"\n    elif revealed_now:\n        kind = \"\
          unlock\"\n    elif ending:\n        kind = \"ending\"\n    else:\n     \
          \   kind = \"progress\"\n\n    bits = [\"工号 %s 在《%s》第 %d 轮：%s\" % (player_id,\
          \ scene_title or \"未派单\", int(turn or 0) + 1, action)]\n    if triggered:\n\
          \        bits.append(\"违反 \" + \"/\".join(triggered))\n    if near:\n  \
          \      bits.append(\"预兆 \" + \"/\".join(near))\n    if revealed_now:\n \
          \       bits.append(\"解锁封存规则 \" + \"/\".join(revealed_now))\n    if ending:\n\
          \        bits.append(\"达成结局 \" + ending)\n    if sealed_hint:\n        bits.append(\"\
          疑似触碰封存 \" + sealed_hint)\n    mem_text = \"；\".join(bits).replace('\"',\
          \ \"'\").replace(\"\\n\", \" \")[:1500]\n\n    cite = \"本轮引用：\" + (\"、\"\
          .join(triggered + near + revealed_now + ([ending] if ending else [])) or\
          \ \"无\")\n    remember_body = json.dumps({\n        \"scope_id\": str(scope_id\
          \ or \"\"),\n        \"kind\": kind,\n        \"text\": mem_text,\n    \
          \    \"reason\": \"dify-chatflow-turn\",\n    }, ensure_ascii=False)\n \
          \   return {\n        \"narration\": narration,\n        \"remember_body\"\
          : remember_body,\n        \"mem_kind\": kind,\n        \"mem_text\": mem_text,\n\
          \        \"violations_next\": violations_next,\n        \"endings_next\"\
          : endings_next,\n        \"revealed_next\": revealed_next,\n        \"turn_next\"\
          : int(turn or 0) + 1,\n        \"stage_next\": \"ended\" if ending else\
          \ \"playing\",\n        \"cite_line\": cite,\n        \"mood\": str(data.get(\"\
          mood\") or \"\")[:16],\n        \"sealed_hint\": sealed_hint,\n    }\n"
