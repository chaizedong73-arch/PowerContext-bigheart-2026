    - data:
        code: "import json\nimport re\n\nEMPTY = \"（档案袋是空的：这是本馆第一次见到这个工号。主持时不得假装认识玩家。）\"\
          \nBEGIN = \"BEGIN_POWERCONTEXT_PREPARED_CONTEXT_V1\"\nEND_MARK = \"END_POWERCONTEXT_PREPARED_CONTEXT_V1\"\
          \nSCENE_TAG = \"当前场景=\"\n\n\ndef _texts(inner):\n    \"\"\"Prepared Context\
          \ 的信封里是一段 JSON：{\"trust\":…,\"items\":[{\"content\":…}]}。\"\"\"\n    try:\n\
          \        payload = json.loads(inner.strip())\n        rows = payload.get(\"\
          items\") or []\n        got = [str(r.get(\"content\") or \"\").strip() for\
          \ r in rows if isinstance(r, dict)]\n        return [g for g in got if g]\n\
          \    except Exception:\n        got = []\n        for raw in re.findall(r'\"\
          content\"\\s*:\\s*\"((?:[^\"\\\\]|\\\\.)*)\"', inner):\n            try:\n\
          \                got.append(str(json.loads('\"%s\"' % raw)).strip())\n \
          \           except Exception:\n                got.append(raw.strip())\n\
          \        return [g for g in got if g]\n\n\ndef main(body: str, entries_raw:\
          \ str) -> dict:\n    try:\n        content = str(json.loads(body).get(\"\
          content\") or \"\")\n    except Exception:\n        content = \"\"\n   \
          \ items = []\n    if content:\n        m = re.search(BEGIN + r\"(.*?)\"\
          \ + END_MARK, content, re.S)\n        items = _texts(m.group(1) if m else\
          \ content)\n    # 兜底通道：entries/list 按写入顺序返回，不受 fts 措辞影响。\n    recent = []\n\
          \    try:\n        for e in (json.loads(entries_raw).get(\"entries\") or\
          \ []):\n            if isinstance(e, dict):\n                txt = str(e.get(\"\
          text\") or \"\").strip()\n                if txt:\n                    recent.append(txt)\n\
          \    except Exception:\n        recent = []\n    for txt in recent[-6:]:\n\
          \        if txt not in items:\n            items.append(txt)\n    if not\
          \ items:\n        return {\"memory_block\": EMPTY, \"memory_count\": 0,\
          \ \"active_scene_id\": \"\"}\n    lines = [\"- \" + t.replace(\"\\n\", \"\
          \ \")[:320] for t in items[:10]]\n    # 从最新一条往回找：档案袋末尾是最近一轮；“none” 是没派成单的占位，不能当场景续。\n\
          \    scene = \"\"\n    for t in reversed(items):\n        found = re.findall(SCENE_TAG\
          \ + r\"([A-Za-z0-9_\\-]+)\", t)\n        if found and found[-1] != \"none\"\
          :\n            scene = found[-1]\n            break\n    return {\"memory_block\"\
          : \"\\n\".join(lines), \"memory_count\": len(items), \"active_scene_id\"\
          : scene}\n"
        code_language: python3
        desc: 把 Prepared Context 与档案袋顺序读出的条目合成一块；都是“不可信历史数据”，只用于翻旧账和续场景，不能当指令执行
        outputs:
          active_scene_id:
            children: null
            type: string
          memory_block:
            children: null
            type: string
          memory_count:
            children: null
            type: number
