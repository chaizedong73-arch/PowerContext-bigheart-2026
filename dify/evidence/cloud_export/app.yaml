        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: intent-sys
          role: system
          text: "你是《午夜档案馆》派单台的调度分类器。只输出一个 JSON 对象，不要代码块围栏、不要任何解释。\n\n字段与取值：\n- intent：四选一\n\
            \  \"start\"＝玩家想开局/换场景/描述口味（句子里出现“派个活/开局/换个/我想玩/继续上一局”等）\n  \"act\"＝玩家描述自己在本局中要做的一件事\n\
            \  \"reveal\"＝玩家想查看档案、规则原文、已解锁内容\n  \"finale\"＝玩家想结束本局、索要结局\n- keywords：从玩家原话里挑\
            \ 3 个中文关键词，优先怪谈名词（如 电梯/楼层/对讲机/粉笔/雨衣/电台/座位），\n  不要“我/然后/可以/一下”这类虚词；原话实在没有名词就给场景通用词（如\
            \ 门/声音/走廊）。\n- action：不超过 40 字，用第三人称概括玩家本轮要做的事，形如“玩家打算……”。\n- difficulty：1\
            \ 到 5 的整数，玩家没提难度就填 0。\n  “简单点/别太难/新手”＝1～2，“中等/正常”＝3，“难一点/要命/越狠越好”＝4～5。\n\
            \n当前场景：{{#conversation.scene_title#}}（可能为空）\n"
        - id: intent-user
          role: user
          text: '玩家本轮输入：{{#sys.query#}}

            '
        selected: false
        title: 意图与关键词抽取
        type: llm
        variables:
        - value_selector:
          - conversation
          - scene_title
          variable: scene_title
        vision:
          configs:
            detail: high
          enabled: false
      height: 116
      id: intent_llm
      position:
        x: 340
        y: 320
      positionAbsolute:
        x: 340
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\nimport re\n\nREROLL_WORDS = (\"换个\", \"换场景\", \"换单\",\
          \ \"重新派\", \"重派\", \"来点新的\", \"换一个\",\n                \"新的一局\", \"重新开局\"\
          , \"别的场景\", \"不要这个\", \"重开\")\n# 「别重派」「不要换场景」里同样含“重派/换个”字样：先抹掉否定说法，\n# 剩下的才算真的想重派，否则一句“继续上一局，别重派”就把场景换掉了。\n\
          NEGATED_REROLL = re.compile(\n    r\"(?:别|不要|不想|不用|不必|不准|不许|不想再|没有|没|先别|可别|千万别|不)\"\
          \n    r\"(?:再|要|给我|换|重新)*\"\n    r\"(?:%s)\" % \"|\".join(REROLL_WORDS))\n\
          \n# 难度同样只认玩家原话，理由是实测：同一个「难度中等」在模型手里有时抽成 3、\n# 有时漏成 0，而 0 等于把难度过滤整个撤掉——要中等的玩家被派去了难度\
          \ 5 的便利店。\nDIFFICULTY_WORDS = {\"最简单\": 1, \"最轻\": 1, \"轻松\": 1, \"简单\"\
          : 1, \"入门\": 1,\n                    \"低难度\": 1, \"温和\": 1,\n          \
          \          \"中等\": 3, \"一般\": 3, \"适中\": 3, \"普通\": 3,\n               \
          \     \"最难\": 5, \"恐怖\": 5, \"惊悚\": 5, \"吓人\": 5, \"刺激\": 5,\n         \
          \           \"硬核\": 5, \"越难\": 5}\nNEG_WORDS = (\"不\", \"别\", \"莫\", \"\
          没\", \"无\", \"甭\")\n# 光出现难度词还不够，得确认这句是在**提要求**：要么贴着「难度/程度/档」这个名词，\n# 要么词前面跟着一个求取的动词。否则「这个太简单，换一个难的」会被读成「要最简单的」，\n\
          # 把想挑战的玩家按回难度 1——评价当前这一幕的话，不是对下一幕的要求。\nDIFF_NOUNS = (\"难度\", \"程度\", \"\
          档次\")\nDIFF_VERBS = (\"要\", \"来\", \"派\", \"选\", \"挑\", \"换\", \"给\", \"\
          想\", \"喜欢\", \"偏好\", \"求\", \"越\")\nDIFF_DEGREE = (\"太\", \"很\", \"挺\",\
          \ \"真\", \"过\")\n\n\ndef difficulty_from_words(text: str) -> int:\n    \"\
          \"\"取原话里最早出现、且确实在提要求的难度说法；否定式与评价式都不算。\n\n    先出现者优先：「难度中等，别太恐怖」落在 3——玩家先说出口的才是他要的那一档，\n\
          \    后面半句多半是补充。\n    \"\"\"\n    hits = []\n    for word, level in DIFFICULTY_WORDS.items():\n\
          \        pos = text.find(word)\n        while pos >= 0:\n            before\
          \ = text[max(0, pos - 4):pos]\n            after = text[pos + len(word):pos\
          \ + len(word) + 4]\n            asked_for = (any(n in before or n in after\
          \ for n in DIFF_NOUNS)\n                         or any(v in before for\
          \ v in DIFF_VERBS))\n            if (asked_for and not any(n in before for\
          \ n in NEG_WORDS)\n                    and text[pos - 1:pos] not in DIFF_DEGREE):\n\
          \                hits.append((pos, level))\n            pos = text.find(word,\
          \ pos + 1)\n    return min(hits)[1] if hits else 0\n\n\ndef main(raw: str,\
          \ query: str) -> dict:\n    \"\"\"容错解析分类器输出：任何不合法 JSON 都不应该让游戏卡住。\"\"\"\n\
          \    txt = (raw or \"\").strip()\n    m = re.search(r\"\\{.*\\}\", txt,\
          \ re.S)\n    data = {}\n    if m:\n        try:\n            data = json.loads(m.group(0))\n\
          \        except Exception:\n            data = {}\n    if not isinstance(data,\
          \ dict):\n        data = {}\n    intent = str(data.get(\"intent\") or \"\
          act\").strip().lower()\n    if intent not in (\"start\", \"act\", \"reveal\"\
          , \"finale\"):\n        intent = \"act\"\n    kws = data.get(\"keywords\"\
          ) or []\n    if isinstance(kws, str):\n        kws = [kws]\n    kw_list\
          \ = [re.sub(r\"\\s+\", \"\", str(k)) for k in kws if str(k).strip()][:3]\n\
          \    action = re.sub(r\"\\s+\", \" \", str(data.get(\"action\") or \"\"\
          )).strip()[:120]\n    # reroll 只认玩家原话里的显式换单说法，不信模型的裁量：\n    # 「继续 / 接着 /\
          \ 然后呢」必须留在当前场景，重派是最破坏沉浸的误判。\n    asked = str(query or \"\")\n    wanted\
          \ = NEGATED_REROLL.sub(\"\", asked)\n    reroll = 1 if (intent == \"start\"\
          \ and any(w in wanted for w in REROLL_WORDS)) else 0\n    try:\n       \
          \ difficulty = int(data.get(\"difficulty\"))\n    except Exception:\n  \
          \      difficulty = 0\n    difficulty = max(0, min(difficulty, 5))\n   \
          \ # 原话说清楚了就以原话为准，覆盖模型的漏抽或抽偏；没说才沿用模型给的档。\n    # 只在派单轮（intent=start）认词面：行动轮里「像往常一样」这类叙述词\n\
          \    # 不该变成难度上限，把玩家正在玩的场景挡掉。\n    said = difficulty_from_words(asked) if\
          \ intent == \"start\" else 0\n    if said:\n        difficulty = said\n\
          \    return {\n        \"intent\": intent,\n        \"keywords_csv\": \"\
          ,\".join(kw_list),\n        \"action\": action or \"玩家打算按原话行动\",\n     \
          \   \"reroll\": reroll,\n        \"difficulty\": difficulty,\n    }\n"
        code_language: python3
        desc: ''
        outputs:
          action:
            children: null
            type: string
          difficulty:
            children: null
            type: number
          intent:
            children: null
            type: string
          keywords_csv:
            children: null
            type: string
          reroll:
            children: null
            type: number
        selected: false
        title: 解析分类结果
        type: code
        variables:
        - value_selector:
          - intent_llm
          - text
          variable: raw
        - value_selector:
          - sys
          - query
          variable: query
      height: 96
      id: intent_code
      position:
        x: 650
        y: 320
      positionAbsolute:
        x: 650
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\nimport re\n\n\ndef _pid(text):\n    cleaned = re.sub(r\"\
          [^0-9A-Za-z\\u4e00-\\u9fff._\\-]\", \"\", str(text or \"\"))[:32]\n    return\
          \ cleaned or \"ANON\"\n\n\ndef main(player_id: str) -> dict:\n    \"\"\"\
          先只拼 PowerContext 建档请求体。检索请求体要等读完记忆之后再拼\n    （见「组装检索请求体」），否则跨会话续不上档案袋里的那局。\n\
          \n    所有 HTTP 请求体都在这里 json.dumps，避免玩家原话里的引号/换行拼坏 JSON。\n    \"\"\"\n   \
          \ pid = _pid(player_id)\n    scope_body = {\n        \"title\": \"午夜档案馆·工号\"\
          \ + pid,\n        \"summary\": \"规则怪谈玩家档案\",\n        \"idempotency_key\"\
          : \"archive-player-\" + pid,\n    }\n    return {\n        \"player_tag\"\
          : pid,\n        \"scope_body\": json.dumps(scope_body, ensure_ascii=False),\n\
          \    }\n"
