app:
  description: '《午夜档案馆》规则怪谈主持应用。Dify Chatflow 负责编排与裁决生成，seekdb（嵌入式 pyseekdb）承担怪谈设定档案库的存储与三路混合检索，

    PowerContext 承担玩家记忆的保存与复用。导入后请检查：环境变量（服务地址与令牌）、两个 LLM 节点的模型绑定。

    '
  icon: 🌙
  icon_background: '#1F2A44'
  icon_type: emoji
  mode: advanced-chat
  name: 午夜档案馆 · 规则怪谈
  use_icon_as_answer_icon: false
