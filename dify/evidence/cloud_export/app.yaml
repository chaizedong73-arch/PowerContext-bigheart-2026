      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 把玩家自然语言归一成 intent / 关键词 / 行动概括，作为检索条件
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 4
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: intent-sys
          role: system
          text: "你是《午夜档案馆》派单台的调度分类器。只输出一个 JSON 对象，不要代码块围栏、不要任何解释。\n\n字段与取值：\n- intent：四选一\n\
            \  \"start\"＝玩家想开局/换场景/描述口味（句子里出现“派个活/开局/换个/我想玩/继续上一局”等）\n  \"act\"＝玩家描述自己在本局中要做的一件事\n\
            \  \"reveal\"＝玩家想查看档案、规则原文、已解锁内容\n  \"finale\"＝玩家想结束本局、索要结局\n- keywords：从玩家原话里挑\
            \ 3 个中文关键词，优先怪谈名词（如 电梯/楼层/对讲机/粉笔/雨衣/电台/座位），\n  不要“我/然后/可以/一下”这类虚词；原话实在没有名词就给场景通用词（如\
            \ 门/声音/走廊）。\n- action：不超过 40 字，用第三人称概括玩家本轮要做的事，形如“玩家打算……”。\n- reroll：只在\
            \ intent=\"start\" 时有意义。玩家明确想要一份**新**委托（“换个/重新派单/来点新的/换场景”）填 1；\n  玩家说“继续上一局/回到刚才那个场景”或首次开局填\
            \ 0。\n\n当前场景：{{#conversation.scene_title#}}（可能为空）\n"
        - id: intent-user
          role: user
          text: '玩家本轮输入：{{#sys.query#}}

            '
        selected: false
        title: 意图与关键词抽取
        type: llm
        variables:
        - value_selector:
          - conversation
          - scene_title
          variable: scene_title
        vision:
          configs:
            detail: high
          enabled: false
      height: 132
      id: intent_llm
      position:
        x: 312
        y: 341
      positionAbsolute:
        x: 312
        y: 341
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: "import json\nimport re\n\n\ndef main(raw: str) -> dict:\n    \"\"\"\
          容错解析分类器输出：任何不合法 JSON 都不应该让游戏卡住。\"\"\"\n    txt = (raw or \"\").strip()\n\
          \    m = re.search(r\"\\{.*\\}\", txt, re.S)\n    data = {}\n    if m:\n\
          \        try:\n            data = json.loads(m.group(0))\n        except\
          \ Exception:\n            data = {}\n    if not isinstance(data, dict):\n\
          \        data = {}\n    intent = str(data.get(\"intent\") or \"act\").strip().lower()\n\
          \    if intent not in (\"start\", \"act\", \"reveal\", \"finale\"):\n  \
          \      intent = \"act\"\n    kws = data.get(\"keywords\") or []\n    if\
          \ isinstance(kws, str):\n        kws = [kws]\n    kw_list = [re.sub(r\"\\\
          s+\", \"\", str(k)) for k in kws if str(k).strip()][:3]\n    action = re.sub(r\"\
          \\s+\", \" \", str(data.get(\"action\") or \"\")).strip()[:120]\n    try:\n\
          \        reroll = 1 if bool(data.get(\"reroll\")) and intent == \"start\"\
          \ else 0\n    except Exception:\n        reroll = 0\n    return {\n    \
          \    \"intent\": intent,\n        \"keywords_csv\": \",\".join(kw_list),\n\
          \        \"action\": action or \"玩家打算按原话行动\",\n        \"reroll\": reroll,\n\
          \    }\n"
        code_language: python3
        desc: ''
        outputs:
          action:
            children: null
            type: string
          intent:
            children: null
            type: string
          keywords_csv:
            children: null
            type: string
          reroll:
            children: null
            type: number
        selected: false
        title: 解析分类结果
        type: code
        variables:
        - value_selector:
          - intent_llm
          - text
          variable: raw
      height: 52
      id: intent_code
      position:
        x: 626
        y: 368
      positionAbsolute:
        x: 626
        y: 368
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: "import json\nimport re\n\n\ndef _pid(text):\n    cleaned = re.sub(r\"\
          [^0-9A-Za-z\\u4e00-\\u9fff._\\-]\", \"\", str(text or \"\"))[:32]\n    return\
          \ cleaned or \"ANON\"\n\n\ndef main(player_id: str, query: str, intent:\
          \ str, action: str, keywords_csv: str,\n         scene_id: str, revealed:\
          \ str, reroll: float, top_k: float) -> dict:\n    \"\"\"所有 HTTP 请求体都在这里\
          \ json.dumps，避免玩家原话里的引号/换行拼坏 JSON。\"\"\"\n    pid = _pid(player_id)\n  \
          \  taste = (action + \" \" + str(query or \"\")).strip()[:600]\n    keep_scene\
          \ = str(scene_id or \"\")\n    if int(reroll or 0) == 1:\n        keep_scene\
          \ = \"\"\n    kinds = max(1, min(int(top_k or 6), 30))\n    scope_body =\
          \ {\n        \"title\": \"午夜档案馆·工号\" + pid,\n        \"summary\": \"规则怪谈玩家档案\"\
          ,\n        \"idempotency_key\": \"archive-player-\" + pid,\n    }\n    scene_body\
          \ = {\n        \"taste\": taste,\n        \"scene_id\": keep_scene,\n  \
          \      \"revealed_csv\": str(revealed or \"\"),\n    }\n    search_body\
          \ = {\n        \"query\": taste,\n        \"scene_id\": keep_scene,\n  \
          \      \"kinds_csv\": \"rule,omen,item,npc,ending\",\n        \"keywords_csv\"\
          : str(keywords_csv or \"\"),\n        \"top_k\": kinds,\n        \"revealed_csv\"\
          : str(revealed or \"\"),\n    }\n    return {\n        \"player_tag\": pid,\n\
          \        \"scope_body\": json.dumps(scope_body, ensure_ascii=False),\n \
          \       \"scene_body\": json.dumps(scene_body, ensure_ascii=False),\n  \
          \      \"search_body\": json.dumps(search_body, ensure_ascii=False),\n \
          \       \"is_start\": \"1\" if intent == \"start\" else \"0\",\n    }\n"
        code_language: python3
        desc: 把玩家原话安全地编成各服务需要的 JSON 请求体
        outputs:
          is_start:
            children: null
            type: string
          player_tag:
            children: null
            type: string
          scene_body:
            children: null
            type: string
          scope_body:
            children: null
            type: string
          search_body:
            children: null
            type: string
        selected: false
        title: 组装请求体
        type: code
        variables:
        - value_selector:
          - start
          - player_id
          variable: player_id
        - value_selector:
          - sys
          - query
          variable: query
        - value_selector:
          - intent_code
          - intent
          variable: intent
        - value_selector:
          - intent_code
          - action
          variable: action
        - value_selector:
          - intent_code
          - keywords_csv
          variable: keywords_csv
        - value_selector:
          - conversation
          - scene_id
          variable: scene_id
        - value_selector:
          - conversation
          - revealed
          variable: revealed
        - value_selector:
          - intent_code
          - reroll
          variable: reroll
        - value_selector:
          - env
          - ARCHIVE_TOP_K
          variable: top_k
      height: 96
      id: req_code
      position:
        x: 960
        y: 320
      positionAbsolute:
        x: 960
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-scope
            key: ''
            type: text
            value: '{{#req_code.scope_body#}}'
          type: raw-text
        desc: PowerContext 建档：同一工号靠 idempotency_key 复用同一个 scope，因此记忆能跨会话续上。参数必须逐字一致，否则返回
          409。
        headers: Content-Type:application/json
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 200
        selected: false
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 建立/复用工号档案袋
        type: http-request
        url: '{{#env.PC_BASE_URL#}}/v1/scopes'
        variables: []
      height: 200
      id: scope_http
      position:
        x: 1270
        y: 320
      positionAbsolute:
        x: 1270
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: "import json\n\n\ndef main(body: str, status: str, fallback: str, player_tag:\
          \ str, keywords_csv: str) -> dict:\n    try:\n        sid = str(json.loads(body).get(\"\
          scope_id\") or \"\")\n    except Exception:\n        sid = \"\"\n    state\
          \ = \"created_or_reused\"\n    if not sid:\n        sid = str(fallback or\
          \ \"\")\n        state = \"fallback_env\" if sid else \"missing\"\n    query\
          \ = (\"%s 违规 结局 偏好 %s\" % (player_tag, keywords_csv)).strip()\n    prepare_body\
          \ = json.dumps({\"scope_id\": sid, \"query\": query, \"max_bytes\": 6000},\n\
          \                              ensure_ascii=False)\n    return {\"scope_id\"\
          : sid, \"scope_state\": state, \"prepare_body\": prepare_body}\n"
        code_language: python3
        desc: ''
        outputs:
          prepare_body:
            children: null
            type: string
          scope_id:
            children: null
            type: string
          scope_state:
            children: null
            type: string
        selected: false
        title: 取回 scope_id
        type: code
        variables:
        - value_selector:
          - scope_http
          - body
          variable: body
        - value_selector:
          - scope_http
          - status_code
          variable: status
        - value_selector:
